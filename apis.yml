aid: invera
name: Invera
description: Invera is a Cordoba, Argentina fintech founded in 2016 that provides embedded investment
  and brokerage infrastructure to banks, fintechs, and financial institutions across Latin America.
  Originally a B2C robo-advisor, it pivoted into a B2B technology provider whose proprietary investment
  core (200,000+ development hours) powers three products - InvWallet (embedded investing that turns any
  monetary account into an investment account), Rocket (an investment-management platform that integrates
  with core banking systems and automates operations), and InvBroker (a portfolio-management and trading
  platform for clients and investment advisors). Invera exposes its capabilities through APIs and
  institution-agnostic infrastructure, with a stated mission of turning 10 million Latin Americans into
  investors. It is backed by 500 Global (500 LatAm B18).
