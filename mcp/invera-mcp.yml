- name: byma_get_quote
  description: 'Devuelve la última cotización de un instrumento del mercado argentino: último precio,
    cierre previo, variación, máximo/mínimo y, si aplica, precios en dólares (CCL/MEP). Acepta ticker
    o nombre. Ej: ''¿a cuánto cerró Apple?'' -> symbol ''AAPL''.'
